[project]
name = "wahlwerk-data"
version = "0.1.0"
description = "Normalised German election bundles for the wahlwerk engine"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Julius Sommer", email = "julius_sommer@mailbox.org" }]
keywords = ["elections", "germany", "bundestag", "open-data", "dl-de-by-2-0"]
dependencies = [
    "wahlwerk",
]

[project.scripts]
wahlwerk-ingest = "wahlwerk_data.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wahlwerk_data"]

[tool.uv.sources]
wahlwerk = { path = "../wahlwerk", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 96
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = [
    "N999",   # module names carry German legal citations
    "RUF012", # frozen pydantic models; pydantic copies defaults
]

[tool.mypy]
strict = true
files = ["src", "tests"]
warn_unreachable = true
